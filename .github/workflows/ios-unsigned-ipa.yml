name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dependency check, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expo dependency check
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci

  build-ios:
    name: Build unsigned device IPA
    needs: verify
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          pod --version
          node --version

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile Release for physical iPhone (iphoneos, unsigned)
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE   Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { echo "xcodebuild FAILED - last 200 lines:"; tail -n 200 xcodebuild.log; exit 1; }
          tail -n 15 xcodebuild.log

      - name: Verify device binary and package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "App bundle: $APP"
          lipo -info "$APP/$EXE"
          otool -l "$APP/$EXE" | grep -A4 LC_BUILD_VERSION | tee buildversion.txt
          if ! grep -Eq 'platform (2|IOS)$' buildversion.txt; then echo "ERROR: not an iPhoneOS device binary"; exit 1; fi
          if [ ! -f "$APP/main.jsbundle" ]; then echo "ERROR: JavaScript bundle missing from Release build"; exit 1; fi
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry PocketLedger-unsigned.ipa Payload)
          ls -lh dist/PocketLedger-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-unsigned-ipa
          path: dist/PocketLedger-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore